<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CDA Quiz</title>
    <link rel="icon" type="image/png" href="assets/aperture.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#FF6700">
    <link rel="apple-touch-icon" href="assets/icon-192.png">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/modules.css">
    <link rel="stylesheet" href="css/labo.css">
    <link rel="stylesheet" href="css/sensei.css">
    <link rel="stylesheet" href="css/aperture.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-content">
                <div>
                    <h1>CDA Quiz</h1>
                    <p>Centre d'Enrichissement</p>
                </div>
            </div>
            <div class="header-side">
                <button class="link-badge" id="linkBadge" style="display: none;"></button>
                <div class="aperture-header-logo" id="apertureLogo" style="cursor: pointer;">
                    <img src="assets/cake.png" alt="The cake is a lie">
                </div>
            </div>
        </div>
        
        <div class="progress-bar">
            <div class="progress-fill" id="progressBar"></div>
        </div>

        <div class="content">
            <!-- Accueil : heros (rendu par js/ui/menu.js, visible sur l'ecran menu) -->
            <section class="ap-hero" id="menuHero" style="display: none;"></section>

            <!-- Selecteur de protocole QUIZ | LABO | VOCABULAIRE : 3 grosses tuiles -->
            <div class="mode-tabs" id="modeTabs" style="display: none;">
                <span class="mode-tabs-label">Choisissez votre protocole</span>
                <div class="mode-tabs-buttons">
                    <button data-tab="quiz" class="active">
                        <span class="tab-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><path d="M8 12.5l2.8 2.8L16.5 9"/></svg></span>
                        <span class="tab-text"><span class="tab-num">01</span><b>Quiz</b><small>QCM par module</small></span>
                    </button>
                    <button data-tab="labo">
                        <span class="tab-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M10 3v6.5L4.8 18.2A1.8 1.8 0 0 0 6.3 21h11.4a1.8 1.8 0 0 0 1.5-2.8L14 9.5V3"/><path d="M7.5 15h9"/></svg></span>
                        <span class="tab-text"><span class="tab-num">02</span><b>Labo</b><small>Code et SQL</small></span>
                    </button>
                    <button data-tab="sensei">
                        <span class="tab-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v8a2.5 2.5 0 0 1-2.5 2.5H11l-4.5 4v-4h0A2.5 2.5 0 0 1 4 13.5z"/><path d="M8.5 11.5l2-5 2 5M9.2 10h2.6M14.5 9.5h2.5"/></svg></span>
                        <span class="tab-text"><span class="tab-num">03</span><b>Vocabulaire</b><small>Parler comme un senior</small></span>
                    </button>
                </div>
            </div>

            <!-- Menu principal -->
            <div class="menu active" id="menu">
                <h2 class="ap-section-title">Sélectionnez un module</h2>

                <div class="module-grid" id="moduleGrid"></div>

                <button class="labo-reset" id="quizResetBtn">Réinitialiser la progression du quiz</button>
            </div>

            <!-- Questions -->
            <div id="quizContent"></div>

            <!-- Résultats -->
            <div class="results" id="results">
                <h2>Résultats</h2>
                
                <div class="score-display">
                    <div class="score" id="finalScore">0</div>
                    <div class="total"><span id="totalQuestions">0</span> questions</div>
                </div>

                <div class="score-time" id="scoreTime"></div>

                <div id="nameInputSection" class="name-input" style="display: none;">
                    <input type="text" id="playerName" placeholder="Entrez votre pseudo pour le classement" maxlength="20">
                    <button class="btn-primary" id="saveScoreBtn">Enregistrer le score</button>
                </div>

                <div class="module-stats" id="moduleStats"></div>

                <div class="leaderboard" id="leaderboard" style="display: none;">
                    <h3>Classement</h3>
                    <div id="leaderboardContent"></div>
                </div>

                <div id="retrySection"></div>

                <div class="ap-results-actions">
                    <button class="btn-primary" id="backToMenuBtn">Retour au menu</button>
                    <button class="btn-primary" id="restartBtn">Recommencer</button>
                </div>
            </div>

            <!-- Mode LABO -->
            <div id="laboHub" style="display: none;"></div>
            <div id="laboSql" style="display: none;"></div>
            <div id="laboCode" style="display: none;"></div>

            <!-- Mode VOCABULAIRE (Sensei) -->
            <div id="senseiRoot" style="display: none;"></div>
        </div>
    </div>
    
    <footer class="footer">
        <p>"The cake is a lie"</p>
        <p>Subject: you | Test Protocol: [REDACTED]</p>
    </footer>

    <script type="module" src="js/app.js?v=5"></script>
</body>
</html>
