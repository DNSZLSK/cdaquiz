<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CDA Quiz</title>
    <link rel="icon" type="image/png" href="https://imgur.com/LRbytrt.png?v=4">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/modules.css">
    <link rel="stylesheet" href="css/labo.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-content">
                <h1>Test d'Aptitude Développeur</h1>
                <p>Protocole d'évaluation des compétences</p>
            </div>
            <div class="aperture-header-logo" id="apertureLogo" style="cursor: pointer;">
                <img src="https://i.imgur.com/7FQrTbz.png" alt="The cake is a lie">
            </div>
        </div>
        
        <div class="progress-bar">
            <div class="progress-fill" id="progressBar"></div>
        </div>

        <div class="content">
            <!-- Onglets QUIZ | LABO -->
            <div class="mode-tabs" id="modeTabs" style="display: none;">
                <button data-tab="quiz" class="active">QUIZ</button>
                <button data-tab="labo">LABO</button>
            </div>

            <!-- Menu principal -->
            <div class="menu active" id="menu">
                <h2>Sélectionnez un module</h2>

                <div class="module-grid" id="moduleGrid"></div>
            </div>

            <!-- Questions -->
            <div id="quizContent"></div>

            <!-- Résultats -->
            <div class="results" id="results">
                <h2>Résultats</h2>
                
                <div class="score-display">
                    <div class="score" id="finalScore">0</div>
                    <div class="total"><span id="totalQuestions">0</span> questions</div>
                </div>

                <div class="score-time" id="scoreTime"></div>

                <div id="nameInputSection" class="name-input" style="display: none;">
                    <input type="text" id="playerName" placeholder="Entrez votre pseudo pour le classement" maxlength="20">
                    <button class="btn-primary" id="saveScoreBtn" style="margin-top: 10px; width: 100%;">Enregistrer le score</button>
                </div>

                <div class="module-stats" id="moduleStats"></div>

                <div class="leaderboard" id="leaderboard" style="display: none;">
                    <h3>Classement</h3>
                    <div id="leaderboardContent"></div>
                </div>

                <div id="retrySection"></div>

                <div style="display: flex; gap: 12px; margin-top: 30px;">
                    <button class="btn-primary" id="backToMenuBtn">Retour au menu</button>
                    <button class="btn-primary" id="restartBtn">Recommencer</button>
                </div>
            </div>

            <!-- Mode LABO -->
            <div id="laboHub" style="display: none;"></div>
            <div id="laboSql" style="display: none;"></div>
            <div id="laboCode" style="display: none;"></div>
        </div>
    </div>
    
    <footer class="footer">
        <p>"The cake is a lie"</p>
        <p>Subject: you | Test Protocol: [REDACTED]</p>
    </footer>

    <script type="module" src="js/app.js?v=2"></script>
</body>
</html>
